name: CI

# Test on the systems users install this bundle on: Ubuntu 24.04 and Windows
# Server 2025, on the Node majors in engines (22 and 24). The runner images are
# pinned rather than `-latest` so a GitHub image migration cannot silently change
# the OS under the suite.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22
          - os: ubuntu-24.04
            node: 24
          - os: windows-2025
            node: 24
    steps:
      - name: Check out the package
        uses: actions/checkout@v7.0.1

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run the package test suite
        run: npm test

      - name: Confirm the packed file list
        # bash on both runners: npm normalises packed paths to forward slashes, and
        # the heredoc keeps the pack assertions in one place on every platform.
        shell: bash
        run: |
          npm pack --dry-run --json > pack.json
          node - <<'NODE'
          const { readFileSync } = require('node:fs')
          const [pack] = JSON.parse(readFileSync('pack.json', 'utf8'))
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
          // npm's strict include for an explicitly listed file is unanchored unless
          // the entry keeps a "./" prefix (which becomes "/README.md"). package.json
          // uses "./README.md" so a nested docs/assets/README.md is not swept in.
          const shipped = manifest.files.map((file) => file.replace(/^\.\//u, ''))
          const files = new Set(pack.files.map((file) => file.path))

          // Every explicitly declared file must be packed. npm also always packs
          // package.json, so the packed set must not contain anything undeclared.
          const allowed = new Set([...shipped, 'package.json'])
          const missing = shipped.filter((file) => !files.has(file))
          const unexpected = [...files].filter((file) => !allowed.has(file))

          // The opt-in prerequisite patch must ship even if the declared list is
          // later edited: a profile without an agent-preset registry needs it.
          const required = ['adapters/dsh/agent-presets.patch.yml']
          const absent = required.filter((file) => !files.has(file))

          // Development-only trees and repository-only tooling must never be packed:
          // the suites, the historical examples and assessments, CI, private .dev
          // evidence, the D2 sources and their renderer, the manual upstream checker,
          // and any temporary directory EGM map sidecar.
          const forbidden = [
            /^\.dev\//u,
            /^\.github\//u,
            /^tests\//u,
            /^test\//u,
            /^examples\//u,
            /^docs\/testing\//u,
            /^diagrams\//u,
            /^scripts\//u,
            /^adapters\/dsh\/check_upstream\.mjs$/u,
            /^adapters\/dsh\/render_diagrams\.mjs$/u,
            /^docs\/assets\/README\.md$/u,
            /^docs\/assets\/[^/]*\.d2$/u,
            /(?:^|\/)EGM\.md$/u,
          ]
          const leaked = [...files].filter((file) => forbidden.some((pattern) => pattern.test(file)))

          if (missing.length > 0) {
            console.error('declared files missing from the npm package:', missing)
            process.exit(1)
          }
          if (absent.length > 0) {
            console.error('required files missing from the npm package:', absent)
            process.exit(1)
          }
          if (unexpected.length > 0) {
            console.error('undeclared files packed into the npm package:', unexpected)
            process.exit(1)
          }
          if (leaked.length > 0) {
            console.error('development files leaked into the npm package:', leaked)
            process.exit(1)
          }
          console.log(`package contents OK: ${files.size} files, ${shipped.length} declared`)
          NODE

  integration:
    name: replay integration (Linux, Node 24, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the package
        uses: actions/checkout@v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/integration/dsh-ci/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/integration/dsh_requirements.txt

      - name: Install the locked test runtime
        run: npm ci --prefix tests/integration/dsh-ci

      - name: Install the locked Python test dependencies
        run: |
          python -m venv "$RUNNER_TEMP/egm-venv"
          "$RUNNER_TEMP/egm-venv/bin/python" -m pip install -r tests/integration/dsh_requirements.txt
          "$RUNNER_TEMP/egm-venv/bin/python" -m pip check

      - name: Run keyless adapter checks
        env:
          DSH_EGM_LIVE: '0'
        run: |
          "$RUNNER_TEMP/egm-venv/bin/python" -m pytest tests/integration tests/unit/test_dsh_traces.py -q --basetemp "$RUNNER_TEMP/egm-replay"

      - name: Retain synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: egm-replay-failure
          path: ${{ runner.temp }}/egm-replay
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
