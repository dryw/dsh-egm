name: CI

# Test on the systems users install this bundle on: Ubuntu 24.04 and Windows
# Server 2025, on the Node majors in engines (22 and 24). The runner images are
# pinned rather than `-latest` so a GitHub image migration cannot silently change
# the OS under the suite.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22
          - os: ubuntu-24.04
            node: 24
          - os: windows-2025
            node: 24
    steps:
      - name: Check out the package
        uses: actions/checkout@v7.0.1

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run the package test suite
        run: node --test

      - name: Confirm the packed file list
        # bash on both runners: npm normalises packed paths to forward slashes, and
        # the heredoc keeps the pack assertions in one place on every platform.
        shell: bash
        run: |
          npm pack --dry-run --json > pack.json
          node - <<'NODE'
          const { readFileSync } = require('node:fs')
          const [pack] = JSON.parse(readFileSync('pack.json', 'utf8'))
          const files = new Set(pack.files.map((file) => file.path))
          const skills = [
            'egm-bootstrap',
            'egm-brainstorm',
            'egm-draft',
            'egm-drift-report',
            'egm-resolve',
            'egm-review',
            'egm-review-loop',
          ]
          const personas = [
            'bootstrap_orchestrator',
            'codebase_details',
            'comprehension',
            'design_critic',
            'implementation_readiness',
            'structural',
            'style',
            'synthesizer',
            'zoom_out',
          ]
          const required = [
            'package.json',
            'index.js',
            'skills-host.js',
            'reviewer-host.js',
            'reviewer-tools.js',
            'cordis.patch.yml',
            'icon.svg',
            'diagrams/workflow.d2',
            'diagrams/workflow.svg',
            'diagrams/protocol.d2',
            'diagrams/protocol.svg',
            'diagrams/render.mjs',
            'README.md',
            'README.zh-CN.md',
            'LICENSE',
            'NOTICE',
            'ADAPTER-NOTES.md',
            'ADAPTATIONS.md',
            'E2E-VERIFICATION.md',
            'VERIFICATION.md',
            'CHANGELOG.md',
            'upstream.lock.json',
            'scripts/check-upstream.mjs',
            'resources/README.md',
            'resources/execution_instructions.md',
            'resources/document_standards/feature-spec-standard.md',
            'resources/document_standards/heilmeier-standard.md',
            'resources/document_standards/implementation-readiness-standard.md',
            'resources/document_standards/re-implementation-standard.md',
            'resources/document_standards/zoom-out-standard.md',
            ...skills.map((skill) => `skills/${skill}/SKILL.md`),
            'skills/egm-draft/references/design_doc.md',
            'skills/egm-bootstrap/references/templates.md',
            'skills/egm-bootstrap/references/worker-return.schema.json',
            ...personas.map((persona) => `agents/${persona}.md`),
          ]
          const missing = required.filter((file) => !files.has(file))
          const leaked = [...files].filter(
            (file) =>
              file.startsWith('test/') ||
              file.startsWith('tests/') ||
              file.startsWith('docs/testing/') ||
              file.startsWith('examples/') ||
              file.startsWith('.github/'),
          )
          if (missing.length > 0) {
            console.error('files missing from the npm package:', missing)
            process.exit(1)
          }
          if (leaked.length > 0) {
            console.error('development files leaked into the npm package:', leaked)
            process.exit(1)
          }
          console.log(`package contents OK: ${files.size} files`)
          NODE

  integration:
    name: replay integration (Linux, Node 24, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the package
        uses: actions/checkout@v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/integration/runtime/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/integration/requirements.txt

      - name: Install the locked test runtime
        run: npm ci --prefix tests/integration/runtime

      - name: Install the locked Python test dependencies
        run: |
          python -m venv "$RUNNER_TEMP/egm-venv"
          "$RUNNER_TEMP/egm-venv/bin/python" -m pip install -r tests/integration/requirements.txt
          "$RUNNER_TEMP/egm-venv/bin/python" -m pip check

      - name: Run keyless adapter checks
        env:
          DSH_EGM_LIVE: '0'
        run: |
          "$RUNNER_TEMP/egm-venv/bin/python" -m pytest tests/integration -q --basetemp "$RUNNER_TEMP/egm-replay"

      - name: Retain synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: egm-replay-failure
          path: ${{ runner.temp }}/egm-replay
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
